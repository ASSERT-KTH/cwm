# Config for SWEbench activation extraction.
# Based on eval_sbv.yaml; only parallelism params differ from the original.
# All per-trajectory inference settings (max_seq, temperature, etc.) are unchanged.
num_rollout_threads: 1
dump_mode: minimal
stride: 2

gen_args:
  use_sampling: true
  vocab_parallel: true
  loss_parallel: true
  temperature: 1.0
  top_p: 0.95
  max_batch: 128
  max_seq: 332800
  host_cache_gb: 20
  tp_size: 2

tasks:
  - env_config: swerl_tool_env:think_tag:modal:eval
    reward_fn: similarities
    path: /proj/assert-berzelius/users/x_andaf/cwm/swebench_verified_swerl.jsonl
    samples_per_prompt: 1
    metrics_spec:
      pass:
        - "@1"
